<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Ghost — Alive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Caveat:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="alive.css">
</head>

<body>
  <a class="home-link" href="index.html">← Back to the journal</a>

  <div class="viewport" id="viewport">
    <img class="alive-image" src="myghostimage.jpeg" alt="A glowing ghost and a black cat under a starry night">

    <!-- Starry sky + shooting stars -->
    <canvas id="starfield"></canvas>

    <!-- Slow-moving clouds -->
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>



    <!-- Floating star particles -->
    <div class="stars-float" id="starsFloat"></div>



    <div class="title-card">
      <span class="subtitle">✦ a living night</span>
      <h1>Even now,<br>but in silence.</h1>
      <p class="caption">Move your mouse — the scene breathes.</p>
    </div>
  </div>

  <script src="alive.js"></script>
</body>

</html>
